name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Upgrade pip
        run: python -m pip install --upgrade pip
      - name: Install test dependencies
        run: python -m pip install ".[dev]"
      - name: Lint
        run: ruff check src tests web_server.py
      - name: Format check
        run: ruff format --check src tests web_server.py
      - name: Check browser JavaScript syntax
        run: node --check web/assets/app.js
      - name: Test
        run: pytest

  package:
    name: Build and verify distribution
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install build frontend
        run: python -m pip install --upgrade pip build
      - name: Build wheel and source distribution
        run: python -m build
      - name: Install final wheel in a fresh virtual environment
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/release-venv"
          "$RUNNER_TEMP/release-venv/bin/python" -m pip install --upgrade pip
          "$RUNNER_TEMP/release-venv/bin/python" -m pip install dist/*.whl
          "$RUNNER_TEMP/release-venv/bin/python" -m pip check
      - name: Verify installed service readiness
        shell: bash
        run: |
          "$RUNNER_TEMP/release-venv/bin/python" - <<'PY'
          import json
          import os
          import subprocess
          import time
          import urllib.request
          from pathlib import Path

          runner_temp = Path(os.environ["RUNNER_TEMP"])
          executable = runner_temp / "release-venv" / "bin" / "jobsearch-web"
          data_dir = runner_temp / "release-smoke-data"
          log_path = runner_temp / "release-smoke.log"
          environment = os.environ.copy()
          environment["SCHEDULER_ENABLED"] = "false"

          with log_path.open("w", encoding="utf-8") as log:
              process = subprocess.Popen(
                  [
                      str(executable),
                      "--host",
                      "127.0.0.1",
                      "--port",
                      "39123",
                      "--data-dir",
                      str(data_dir),
                  ],
                  env=environment,
                  stdout=log,
                  stderr=subprocess.STDOUT,
              )
              try:
                  deadline = time.monotonic() + 30
                  last_error = None
                  while time.monotonic() < deadline:
                      if process.poll() is not None:
                          raise RuntimeError(
                              f"installed service exited with status {process.returncode}"
                          )
                      try:
                          with urllib.request.urlopen(
                              "http://127.0.0.1:39123/readyz", timeout=2
                          ) as response:
                              payload = json.load(response)
                          if response.status == 200 and payload["data"]["status"] == "ok":
                              break
                      except Exception as error:
                          last_error = error
                          time.sleep(0.5)
                  else:
                      raise RuntimeError(f"readiness probe timed out: {last_error}")
              finally:
                  process.terminate()
                  try:
                      process.wait(timeout=10)
                  except subprocess.TimeoutExpired:
                      process.kill()
                      process.wait(timeout=5)

          print(log_path.read_text(encoding="utf-8"))
          PY

  docker:
    name: Build and smoke-test container
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build image without publishing
        run: docker build --tag career-radar:ci .
      - name: Verify non-root runtime and readiness
        shell: bash
        run: |
          test "$(docker image inspect --format '{{.Config.User}}' career-radar:ci)" = "app"
          docker run --detach \
            --name career-radar-ci \
            --publish 127.0.0.1:39124:3000 \
            --env SCHEDULER_ENABLED=false \
            career-radar:ci
          trap 'docker logs career-radar-ci; docker rm --force career-radar-ci' EXIT
          curl --fail --silent --show-error \
            --retry 30 \
            --retry-delay 1 \
            --retry-all-errors \
            http://127.0.0.1:39124/readyz
